name: CI & Scheduled Jobs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run nightly at 00:00 UTC (expire memberships, digest emails)
    - cron: '0 0 * * *'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run test suite
        run: npm test

      - name: Lint Theme Tokens
        run: npm run lint:theme

      - name: Bundle & Motion Architecture Audit
        run: npm run bundle-audit

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets['NEXT_PUBLIC_APP_URL'] || 'https://wefik.world' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets['NEXT_PUBLIC_SUPABASE_URL'] || 'https://placeholder-project.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets['NEXT_PUBLIC_SUPABASE_ANON_KEY'] || 'placeholder-anon-key' }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets['NEXT_PUBLIC_RAZORPAY_KEY_ID'] || 'rzp_test_placeholder' }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets['NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME'] || 'ash7ockb' }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets['NEXT_PUBLIC_POSTHOG_KEY'] || 'phc_placeholder' }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets['NEXT_PUBLIC_POSTHOG_HOST'] || 'https://us.i.posthog.com' }}
          UPSTASH_REDIS_REST_URL: ${{ secrets['UPSTASH_REDIS_REST_URL'] || 'https://placeholder.upstash.io' }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets['UPSTASH_REDIS_REST_TOKEN'] || 'placeholder' }}

  nightly-maintenance:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Supabase Edge Function for membership expiry
        run: |
          echo "Running nightly maintenance jobs via Supabase Edge Functions..."
          # curl -X POST "$NEXT_PUBLIC_SUPABASE_URL/functions/v1/nightly-maintenance" \
          #   -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"
