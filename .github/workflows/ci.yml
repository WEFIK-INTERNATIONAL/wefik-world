name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint (zero warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: 'https://www.wefik.world'
          NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder-project.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder-anon-key'
          NEXT_PUBLIC_RAZORPAY_KEY_ID: 'rzp_test_placeholder'
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: 'ash7ockb'
          NEXT_PUBLIC_POSTHOG_KEY: 'phc_placeholder'
          NEXT_PUBLIC_POSTHOG_HOST: 'https://us.i.posthog.com'
          UPSTASH_REDIS_REST_URL: 'https://placeholder.upstash.io'
          UPSTASH_REDIS_REST_TOKEN: 'placeholder'

